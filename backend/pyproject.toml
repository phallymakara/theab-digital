[project]
name = "digital-theab-backend"
version = "0.1.0"
description = "Digital Theab (ធៀបឌីជីថល) - FastAPI Backend for Khmer Digital Invitations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "bcrypt>=4.0.1",
    "fastapi>=0.141.0",
    "numpy>=2.0.0",
    "pillow>=12.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "qrcode>=8.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
dev = "app.main:run"
start = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
