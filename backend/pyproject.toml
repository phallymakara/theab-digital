[project]
name = "digital-theab-backend"
version = "0.1.0"
description = "Digital Theab (ធៀបឌីជីថល) - FastAPI Backend for Khmer Digital Invitations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "qrcode>=8.2",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dev = "app.main:run"
start = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
